[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json-stand"
version = "0.1.0"
description = "JSON (pdf-stand shape) → Excel stand"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Anton Butov" }]
dependencies = [
  "openpyxl>=3.1.5",
  "Pillow>=10.0.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[project.scripts]
json-stand = "json_stand.cli:main"

[tool.setuptools.packages.find]
include = ["json_stand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "libreoffice: requires soffice on PATH",
]
